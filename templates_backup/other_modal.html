<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Gateway</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>

<body style="background-color: #f4f7f6; padding: 50px;">
  <div class="container text-center">
    <h2>Photo Captured!</h2>
    <p class="text-muted">Please specify why this person is here.</p>

    <div style="margin: 20px 0;">
      {% if shot_filename %}
      <img src="{{ url_for('static', filename='shots/' + shot_filename) }}" alt="Captured Photo" width="300"
        class="img-thumbnail shadow">
      {% else %}
      <p class="text-danger">Failed to capture photo.</p>
      {% endif %}
    </div>

    <div class="row" style="max-width: 800px; margin: 0 auto;">
      <div class="col-md-6" style="margin-bottom: 15px;">
        <form action="{{ url_for('face_auth.other_result') }}" method="POST">
          <input type="hidden" name="shot_filename" value="{{ shot_filename }}">
          <button type="submit" class="btn btn-primary btn-lg btn-block"
            style="width: 100%; white-space: normal; padding: 20px;">
            <strong>Option A: Mark Attendance</strong><br><small>(If External Staff)</small>
          </button>
        </form>
      </div>
      <div class="col-md-6">
        <form action="{{ url_for('face_auth.other_skip') }}" method="POST">
          <input type="hidden" name="shot_filename" value="{{ shot_filename }}">
          <button type="submit" class="btn btn-warning btn-lg btn-block"
            style="width: 100%; white-space: normal; padding: 20px;">
            <strong>Option B: Quick Log</strong><br><small>(If Not External Staff)</small>
          </button>
        </form>
      </div>
    </div>
  </div>
</body>

</html>
