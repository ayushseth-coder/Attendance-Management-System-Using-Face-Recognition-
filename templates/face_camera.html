<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Face Authentication - Smart Scanner</title>
    <!-- Modern Biometric Scanner Styles -->
    <link href="{{ url_for('static', filename='camera.css') }}" rel="stylesheet" />
    <link href="../static/camera.css" rel="stylesheet" />
    <!-- Font Awesome & Tailwind CSS for Modern Project UI Parity -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Dependencies & Centralized Alerts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='face_alerts.js') }}"></script>
</head>
<body>
    <div class="scanner-wrapper">
        <div class="scanner-card">
            <!-- Live Status Indicator -->
            <div class="status-badge">
                <div class="live-indicator"></div>
                <span id="scan-status">Employee Biometric Gateway</span>
            </div>

            <!-- Header Titles -->
            <h1 class="scanner-title">Employee <span class="highlight">Face Login</span></h1>
            <p class="scanner-subtitle">Look directly at the camera. If no employee match is found, you will automatically transition to visitor processing.</p>

            <!-- Camera Source Selector Dropdown (Shown when USB WebCam connected) -->
            <div class="mb-3 text-center" id="camera-select-wrapper" style="display: none;">
                <select id="camera-select" class="form-select text-sm font-medium border border-slate-300 rounded-lg shadow-sm bg-white p-2 text-slate-700" style="max-width: 320px; margin: 0 auto; cursor: pointer;">
                </select>
            </div>

            <!-- Spacious Rounded Viewfinder with Clockwise Green Border Light -->
            <div class="camera-frame-wrapper">
                <div class="camera-inner">
                    <video id="webcam" autoplay playsinline style="width:100%; height:100%; object-fit:cover; border-radius:1.5rem;"></video>
                    <img id="camera-feed" src="" alt="Camera Feed" style="display:none;" />
                </div>
            </div>

            <!-- Digital Timer Display -->
            <div class="timer-box" id="timer-container">
                <i class="fas fa-id-badge text-emerald-600 me-2"></i> Capturing in <span class="timer-number" id="timer">3</span> seconds
            </div>

            <!-- Feature & Instructional Pills -->
            <div class="scanner-tips">
                <div class="tip-chip"><i class="fas fa-user-check"></i> Instant Attendance</div>
                <div class="tip-chip"><i class="fas fa-lock"></i> Secure Vector DB</div>
                <div class="tip-chip"><i class="fas fa-shield"></i> Anti-Spoof Guard</div>
            </div>
        </div>
    </div>

<script>
    const video = document.getElementById('webcam');
    const cameraFeed = document.getElementById('camera-feed');
    const cameraSelectWrapper = document.getElementById('camera-select-wrapper');
    const cameraSelect = document.getElementById('camera-select');
    let useWebcamJS = false;
    let currentStream = null;

    function stopCurrentStream() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
    }

    function startCamera(deviceId = null) {
        stopCurrentStream();
        const constraints = {
            video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
        };
        
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    currentStream = stream;
                    video.srcObject = stream;
                    video.style.display = 'block';
                    cameraFeed.style.display = 'none';
                    useWebcamJS = true;
                    populateCameraList();
                })
                .catch(function(err) {
                    console.log("Browser camera fallback:", err);
                    video.style.display = 'none';
                    cameraFeed.style.display = 'block';
                });
        } else {
            video.style.display = 'none';
            cameraFeed.style.display = 'block';
        }
    }

    function populateCameraList() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
        
        navigator.mediaDevices.enumerateDevices()
            .then(function(devices) {
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                if (videoDevices.length > 1) {
                    cameraSelectWrapper.style.display = 'block';
                    cameraSelect.innerHTML = '';
                    videoDevices.forEach((device, index) => {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || `📷 Camera ${index + 1} (USB WebCam)`;
                        if (currentStream && currentStream.getVideoTracks()[0].getSettings().deviceId === device.deviceId) {
                            option.selected = true;
                        }
                        cameraSelect.appendChild(option);
                    });
                }
            });
    }

    if (cameraSelect) {
        cameraSelect.addEventListener('change', function() {
            if (this.value) {
                startCamera(this.value);
            }
        });
    }

    startCamera();


    let timeLeft = 3;
    const timerEl = document.getElementById('timer');
    const timerContainer = document.getElementById('timer-container');
    const scanStatus = document.getElementById('scan-status');

    const countdown = setInterval(() => {
        timeLeft--;
        if (timerEl) {
            timerEl.textContent = timeLeft;
        }

        if (timeLeft <= 0) {
            clearInterval(countdown);
            if (timerContainer) {
                timerContainer.innerHTML = '<i class="fas fa-spinner fa-spin text-emerald-600 me-2"></i> <span class="font-bold text-slate-700">Verifying Identity...</span>';
            }
            if (scanStatus) {
                scanStatus.textContent = "Processing Face Vectors...";
            }
            captureFaceAndProceed();
        }
    }, 1000);

    function captureFaceAndProceed() {
        if (useWebcamJS && video.videoWidth) {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/png');

            fetch("{{ url_for('image_processing.save_webcam_frame') }}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            }).then(() => {
                callFaceResult();
            }).catch(() => {
                callFaceResult();
            });
        } else {
            callFaceResult();
        }
    }

    function callFaceResult() {
        fetch("{{ url_for('face_auth.face_result') }}?t=" + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                if (handleFaceAlerts && handleFaceAlerts(data)) {
                    return;
                } else if (data.status === 'redirect') {
                    window.location.href = data.url;
                } else if (data.status === "success") {
                    document.open();
                    document.write(data.html);
                    document.close();
                }
            })
            .catch(err => {
                console.error("Face result error:", err);
            });
    }
</script>

</body>
</html>
