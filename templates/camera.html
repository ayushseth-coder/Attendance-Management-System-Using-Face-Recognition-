<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Scan - Camera</title>
    <!-- Modern Biometric Scanner Styles -->
    <link href="{{ url_for('static', filename='camera.css') }}" rel="stylesheet" />
    <link href="../static/camera.css" rel="stylesheet" />
    <!-- Font Awesome & Tailwind CSS for Modern Project UI Parity -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Dependencies -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="scanner-wrapper">
        <div class="scanner-card">
            <!-- Live Status Indicator -->
            <div class="status-badge">
                <div class="live-indicator"></div>
                <span id="scan-status">Smart Camera Live</span>
            </div>

            <!-- Header Titles -->
            <h1 class="scanner-title">Biometric <span class="highlight">Scanner</span></h1>
            <p class="scanner-subtitle">Please position your face within the frame for automated image capture.</p>

            <!-- Spacious Rounded Viewfinder with Clockwise Green Border Light -->
            <div class="camera-frame-wrapper">
                <div class="camera-inner">
                    <video id="webcam" autoplay playsinline style="width:100%; height:100%; object-fit:cover; border-radius:1.5rem;"></video>
                    <img id="camera-feed" src="{{ url_for('image_processing.video_feed') }}" alt="Camera Feed" style="display:none;" />
                </div>
            </div>

            <!-- Digital Timer Display -->
            <div class="timer-box" id="timer-container">
                <i class="fas fa-camera text-emerald-600 me-2"></i> Capturing in <span class="timer-number" id="timer">3</span> seconds
            </div>

            <!-- Feature & Instructional Pills -->
            <div class="scanner-tips">
                <div class="tip-chip"><i class="fas fa-lightbulb"></i> Ensure Lighting</div>
                <div class="tip-chip"><i class="fas fa-camera"></i> Auto Capture</div>
                <div class="tip-chip"><i class="fas fa-check-circle"></i> High Precision</div>
            </div>
        </div>
    </div>

<script>
    const video = document.getElementById('webcam');
    const cameraFeed = document.getElementById('camera-feed');
    let useWebcamJS = false;

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } })
            .then(function(stream) {
                video.srcObject = stream;
                useWebcamJS = true;
            })
            .catch(function(err) {
                console.log("Browser camera fallback to server feed:", err);
                video.style.display = 'none';
                cameraFeed.style.display = 'block';
            });
    } else {
        video.style.display = 'none';
        cameraFeed.style.display = 'block';
    }

    let timeLeft = 3;
    const timerEl = document.getElementById('timer');
    const timerContainer = document.getElementById('timer-container');
    const scanStatus = document.getElementById('scan-status');

    const countdown = setInterval(() => {
        timeLeft--;
        if(timerEl) {
            timerEl.textContent = timeLeft;
        }

        if (timeLeft <= 0) {
            clearInterval(countdown);
            if(timerContainer) {
                timerContainer.innerHTML = '<i class="fas fa-spinner fa-spin text-emerald-600 me-2"></i> <span class="font-bold text-slate-700">Captured...</span>';
            }
            if(scanStatus) {
                scanStatus.textContent = "Processing Capture...";
            }
            captureFrameAndProceed();
        }
    }, 1000);

    function captureFrameAndProceed() {
        if (useWebcamJS && video.videoWidth) {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/png');
            
            const roleType = new URLSearchParams(window.location.search).get('role_type') || 'visitor';

            fetch("{{ url_for('image_processing.save_webcam_frame') }}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            }).then(() => {
                window.location.href = "{{ url_for('image_processing.show_captured') }}?role_type=" + roleType;
            }).catch(() => {
                window.location.href = "{{ url_for('image_processing.show_captured') }}?role_type=" + roleType;
            });
        } else {
            const roleType = new URLSearchParams(window.location.search).get('role_type') || 'visitor';
            window.location.href = "{{ url_for('image_processing.show_captured') }}?role_type=" + roleType;
        }
    }
</script>

<script>
window.addEventListener("pageshow", function(event) {
    if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
        window.location.reload();
    }
});
</script>
</body>
</html>
