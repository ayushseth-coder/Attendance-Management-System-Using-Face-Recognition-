<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-section {
            max-width: 500px;
            margin: auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        .form-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .form-header h2 {
            margin: 0;
        }
        
        .profile-pic {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .btn-cancel {
            background-color: #fff;
            border: 1px solid #f97316;
            color: #f97316;
        }
        
        .btn-save {
            background-color: #f97316;
            color: #fff;
        }
        
        .form-control:valid~.valid-feedback {
            display: block;
        }
    </style>
</head>

<body class="bg-light">
    <h2 style="text-align: center;color:rgba(4, 4, 213, 0.863);   margin-bottom: -30px;">Edit profile</h2>
    <div class="container py-5">
        <div class="form-section">
            <div class="form-header">

                <form method="POST" action="{{ url_for('auth.upload_profile_image') }}" enctype="multipart/form-data">
                    <label for="file-upload">
                        <img src="{{ data.image if data and 'image' in data and data.image else 'https://ui-avatars.com/api/?name=' + (data.Name | urlencode if data and 'Name' in data else 'User') + '&background=0d6efd&color=fff&size=150' }}"
                             alt="User"
                             class="profile-pic shadow-sm"
                             style="cursor: pointer; width: 150px; height: 150px; object-fit: cover; border-radius: 50%;"
                             title="Click to change profile picture">
                    </label>
                    <input id="file-upload" type="file" name="profile_image" style="display: none;" onchange="this.form.submit();">
                </form>
                
            </div>
            <form method="POST" action="{{ url_for('auth.update_profile') }}" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="Name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="Name" name="Name" value="{{ data['Name'] if data and 'Name' in data else '' }}" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email (Read Only)</label>
                    <input type="email" class="form-control" id="email" value="{{ data['Email'] if data and 'Email' in data else '' }}" readonly>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="address" name="address" value="{{ data['address'] if data and 'address' in data else '' }}" required>
                </div>

                <div class="mb-3">
                    <label for="mobile" class="form-label">Contact Number</label>
                    <input type="text" class="form-control" id="mobile" name="mobile" value="{{ data['Phone'] if data and 'Phone' in data else '' }}" required>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <a href="{{ url_for('auth.profile') }}" class="btn btn-cancel me-2">Cancel</a>
                    <button type="submit" class="btn btn-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS Bundle (with Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Bootstrap validation
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')

            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>

</body>

</html>
