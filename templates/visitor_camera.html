<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Smart Scan</title>
  <link href="../static/camera.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
        <div class="camera-wrapper">
          <div class="camera-box">
  <form>
    <h2>VISITOR PRE-CHECK: <span id="timer">3</span> seconds</h2>
    <p class="text-muted text-center">Checking if you are a "Regular Visitor"...</p>
    <div style="margin-top: 20px;" class="form-row">
      <!-- Reusing the standard video feed -->
      <img src="{{ url_for('face_auth.face_video_feed') }}" width="100%" height="auto" alt="Camera Feed" />
    </div>
  </form>
</div>
</div>
</div>
<script>
  let timeLeft = 3; // seconds
  const timerEl = document.getElementById('timer');

  const countdown = setInterval(() => {
    timeLeft--;
    timerEl.textContent = timeLeft;
    
    if (timeLeft <= 0) {
      clearInterval(countdown);
      timerEl.textContent = "Checking Database...";
    }
  }, 1000);

// After 4.5 seconds, redirect to the visitor pre-check result
setTimeout(function() {
    window.location.href = "{{ url_for('face_auth.visitor_result') }}";
}, 4500);
</script>
</body>
</html>
