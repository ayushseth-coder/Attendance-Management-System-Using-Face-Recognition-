<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Smart Scan - Face Recognition</title>
    <!-- Modern Biometric Scanner Styles -->
    <link href="{{ url_for('static', filename='camera.css') }}" rel="stylesheet" />
    <link href="../static/camera.css" rel="stylesheet" />
    <!-- Font Awesome & Tailwind CSS for Modern Project UI Parity -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Dependencies & Centralized Alerts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='face_alerts.js') }}"></script>
</head>
<body>
    <div class="scanner-wrapper">
        <div class="scanner-card">
            <!-- Live Status Indicator -->
            <div class="status-badge">
                <div class="live-indicator"></div>
                <span id="scan-status">AI Live Recognition Active</span>
            </div>

            <!-- Header Titles -->
            <h1 class="scanner-title">Visitor <span class="highlight">Smart Scan</span></h1>
            <p class="scanner-subtitle">Please align your face comfortably within the frame. Checking pre-registered visitor credentials.</p>

            <!-- Spacious Rounded Viewfinder with Clockwise Green Border Light -->
            <div class="camera-frame-wrapper">
                <div class="camera-inner">
                    <img id="camera-feed" src="" alt="Camera Feed" />
                </div>
            </div>

            <!-- Digital Timer Display -->
            <div class="timer-box" id="timer-container">
                <i class="fas fa-camera text-emerald-600 me-2"></i> Capturing in <span class="timer-number" id="timer">3</span> seconds
            </div>

            <!-- Feature & Instructional Pills -->
            <div class="scanner-tips">
                <div class="tip-chip"><i class="fas fa-lightbulb"></i> Well-lit area</div>
                <div class="tip-chip"><i class="fas fa-eye"></i> Look at camera</div>
                <div class="tip-chip"><i class="fas fa-shield-halved"></i> Liveness Verified</div>
            </div>
        </div>
    </div>

<script>
  let timeLeft = 3; // seconds
  const timerEl = document.getElementById('timer');
  const timerContainer = document.getElementById('timer-container');
  const scanStatus = document.getElementById('scan-status');

  const countdown = setInterval(() => {
    timeLeft--;
    if (timerEl) {
        timerEl.textContent = timeLeft;
    }
    
    if (timeLeft <= 0) {
      clearInterval(countdown);
      if (timerContainer) {
          timerContainer.innerHTML = '<i class="fas fa-circle-notch fa-spin text-emerald-600 me-2"></i> <span class="font-bold text-slate-700">Checking Database...</span>';
      }
      if (scanStatus) {
          scanStatus.textContent = "Matching Biometrics...";
      }
    }
  }, 1000);

setTimeout(function() {
    fetch("{{ url_for('face_auth.visitor_result') }}")
        .then(response => response.json())
        .then(data => {
            if (handleFaceAlerts(data)) {
                return; // Alert handled
            } else if (data.status === 'redirect') {
                window.location.href = data.url;
            } else if (data.status === 'success') {
                document.open();
                document.write(data.html);
                document.close();
            } else {
                console.error("Unknown response status:", data);
            }
        })
        .catch(err => {
            console.error("Error calling visitor_result:", err);
            // Fallback just in case
            window.location.href = "{{ url_for('image_processing.show_captured', role_type='visitor') }}";
        });
}, 6000);
</script>

<script>
    window.addEventListener("pageshow", function(event) {
        if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
            window.location.reload();
        }
    });

    document.addEventListener("DOMContentLoaded", function() {
        var img = document.getElementById("camera-feed");
        if(img) {
            var url = "";
            if (window.location.href.includes("face_login")) {
                url = "{{ url_for('face_auth.face_video_feed') }}";
            } else {
                url = "{{ url_for('image_processing.video_feed') }}";
            }
            img.src = url + "?t=" + new Date().getTime();
        }
    });
</script>
</body>
</html>
