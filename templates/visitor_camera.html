<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Smart Scan - Face Recognition</title>
    <!-- Modern Biometric Scanner Styles -->
    <link href="{{ url_for('static', filename='camera.css') }}" rel="stylesheet" />
    <link href="../static/camera.css" rel="stylesheet" />
    <!-- Font Awesome & Tailwind CSS for Modern Project UI Parity -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Dependencies & Centralized Alerts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='face_alerts.js') }}"></script>
</head>
<body>
    <div class="scanner-wrapper">
        <div class="scanner-card">
            <!-- Live Status Indicator -->
            <div class="status-badge">
                <div class="live-indicator"></div>
                <span id="scan-status">AI Live Recognition Active</span>
            </div>

            <!-- Header Titles -->
            <h1 class="scanner-title">Visitor <span class="highlight">Smart Scan</span></h1>
            <p class="scanner-subtitle">Please align your face comfortably within the frame. Checking pre-registered visitor credentials.</p>

            <!-- Spacious Rounded Viewfinder with Clockwise Green Border Light -->
            <div class="camera-frame-wrapper">
                <div class="camera-inner">
                    <video id="webcam" autoplay playsinline style="width:100%; height:100%; object-fit:cover; border-radius:1.5rem;"></video>
                    <img id="camera-feed" src="" alt="Camera Feed" style="display:none;" />
                </div>
            </div>

            <!-- Digital Timer Display -->
            <div class="timer-box" id="timer-container">
                <i class="fas fa-camera text-emerald-600 me-2"></i> Capturing in <span class="timer-number" id="timer">3</span> seconds
            </div>

            <!-- Feature & Instructional Pills -->
            <div class="scanner-tips">
                <div class="tip-chip"><i class="fas fa-lightbulb"></i> Well-lit area</div>
                <div class="tip-chip"><i class="fas fa-eye"></i> Look at camera</div>
                <div class="tip-chip"><i class="fas fa-shield-halved"></i> Liveness Verified</div>
            </div>
        </div>
    </div>

<script>
    const video = document.getElementById('webcam');
    const cameraFeed = document.getElementById('camera-feed');
    let useWebcamJS = false;

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } })
            .then(function(stream) {
                video.srcObject = stream;
                useWebcamJS = true;
            })
            .catch(function(err) {
                console.log("Browser camera fallback:", err);
                video.style.display = 'none';
                cameraFeed.style.display = 'block';
            });
    } else {
        video.style.display = 'none';
        cameraFeed.style.display = 'block';
    }

    let timeLeft = 3;
    const timerEl = document.getElementById('timer');
    const timerContainer = document.getElementById('timer-container');
    const scanStatus = document.getElementById('scan-status');

    const countdown = setInterval(() => {
        timeLeft--;
        if(timerEl) {
            timerEl.textContent = timeLeft;
        }

        if (timeLeft <= 0) {
            clearInterval(countdown);
            if(timerContainer) {
                timerContainer.innerHTML = '<i class="fas fa-spinner fa-spin text-emerald-600 me-2"></i> <span class="font-bold text-slate-700">Verifying...</span>';
            }
            if(scanStatus) {
                scanStatus.textContent = "Processing Biometrics...";
            }
            captureVisitorAndProceed();
        }
    }, 1000);

    function captureVisitorAndProceed() {
        if (useWebcamJS && video.videoWidth) {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/png');

            fetch("{{ url_for('image_processing.save_webcam_frame') }}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            }).then(() => {
                callVisitorResult();
            }).catch(() => {
                callVisitorResult();
            });
        } else {
            callVisitorResult();
        }
    }

    function callVisitorResult() {
        fetch('/visitor_result')
            .then(response => response.json())
            .then(data => {
                if (data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    window.location.href = "{{ url_for('image_processing.show_captured', role_type='visitor') }}";
                }
            })
            .catch(err => {
                window.location.href = "{{ url_for('image_processing.show_captured', role_type='visitor') }}";
            });
    }
</script>

</body>
</html>
