<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Smart Scan</title>
  <link href="../static/camera.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- Include Centralized Face Alerts Logic -->
<script src="{{ url_for('static', filename='face_alerts.js') }}"></script>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
        <div class="camera-wrapper">
          <div class="camera-box">
  <form>
    <h2>VISITOR PRE-CHECK: <span id="timer">3</span> seconds</h2>
    <p class="text-muted text-center">Checking if you are a "Regular Visitor"...</p>
    <div style="margin-top: 20px;" class="form-row">
      <!-- Reusing the standard video feed -->
      <img id="camera-feed" src="" width="100%" height="auto" alt="Camera Feed" />
    </div>
  </form>
</div>
</div>
</div>
<script>
  let timeLeft = 3; // seconds
  const timerEl = document.getElementById('timer');

  const countdown = setInterval(() => {
    timeLeft--;
    timerEl.textContent = timeLeft;
    
    if (timeLeft <= 0) {
      clearInterval(countdown);
      timerEl.textContent = "Checking Database...";
    }
  }, 1000);

setTimeout(function() {
    fetch("{{ url_for('face_auth.visitor_result') }}")
        .then(response => response.json())
        .then(data => {
            if (handleFaceAlerts(data)) {
                return; // Alert handled
            } else if (data.status === 'redirect') {
                window.location.href = data.url;
            } else if (data.status === 'success') {
                document.open();
                document.write(data.html);
                document.close();
            } else {
                console.error("Unknown response status:", data);
            }
        })
        .catch(err => {
            console.error("Error calling visitor_result:", err);
            // Fallback just in case
            window.location.href = "{{ url_for('image_processing.show_captured', role_type='visitor') }}";
        });
}, 6000);
</script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        var img = document.getElementById("camera-feed");
        if(img) {
            var url = "";
            if (window.location.href.includes("face_login")) {
                url = "{{ url_for('face_auth.face_video_feed') }}";
            } else {
                url = "{{ url_for('image_processing.video_feed') }}";
            }
            img.src = url + "?t=" + new Date().getTime();
        }
    });
</script>
</body>
</html>
