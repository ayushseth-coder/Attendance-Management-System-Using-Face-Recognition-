<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="{{ url_for('static', filename='base.css') }}" rel="stylesheet" />
    <title>{% block title %}MySite{% endblock title %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="preload">
    <script>
        if (localStorage.getItem('sidebarState') === 'collapsed') {
            document.body.classList.add('sidebar-collapsed');
        }
    </script>


    <!-- Top Navbar Removed -->


    <div>
        <div>
            <!-- Sidebar -->

            <nav class="sidebar nav flex-column nav-pills" id="sidebar-tab" role="tablist">
                
                <!-- Hamburger inside Sidebar -->
                <div class="text-center mt-3">
                    <i class="fas fa-bars" style="cursor: pointer; font-size: 24px; color: #cbd5e1;" onclick="toggleSidebar()"></i>
                </div>

                <!-- Profile Section -->
                <div class="text-center my-4">
                    <a href="{{url_for('auth.profile')}}">
                        <img src="https://i.pravatar.cc/150" class="rounded-circle border border-white d-block mx-auto" alt="Avatar" style="width: 120px; height: 120px; border-width: 2px !important; background-color: white; padding: 0px;">
                    </a>
                    <h5 class="text-white mt-3 mb-0" style="letter-spacing: 1px;">SECURITY</h5>
                    <small style="color: #a4b7d1;">Profile</small>
                </div>

                <a class="nav-link" id="tab-home" href="{{url_for('security.home')}}">
                    <i class="fas fa-home"></i> <span class="nav-text">Dashboard</span>
                </a>
                <a class="nav-link" id="tab-face" href="{{url_for('face_auth.select_role')}}">
                    <i class="fas fa-user-circle"></i> <span class="nav-text">Face Login</span>
                </a>
                <a class="nav-link" id="tab-camera" href="{{url_for('otp_gen.send_sms')}}">
                    <i class="fas fa-id-badge"></i> <span class="nav-text">Visitor Pass</span>
                </a>
                <a class="nav-link" id="tab-active" href="{{url_for('security.visitor')}}">
                    <i class="fas fa-users"></i> <span class="nav-text">Visitors</span>
                </a>
                <!-- <a class="nav-link" id="tab-overview" href="{{url_for('security.overview')}}">
                    <i class="fas fa-chart-line"></i> <span class="nav-text">Visitor Overview</span>
                </a> -->

                <a class="nav-link" id="tab-logout" href="#" data-bs-toggle="modal" data-bs-target="#logoutModal">
                    <i class="fas fa-sign-out-alt"></i> <span class="nav-text">Logout</span>
                </a>
            </nav>

            <!-- Main Content Area -->
            <main class="py-4 content-area position-relative">
                {% block body %}

                {% endblock body %}
            </main>
        </div>
    </div>

    <script>
        // Remove preload class after page loads to enable transitions
        window.addEventListener('load', function() {
            document.body.classList.remove('preload');
        });

        function toggleSidebar() {
            if (window.innerWidth <= 768) {
                document.querySelector('.sidebar').classList.toggle('active');
            } else {
                document.body.classList.toggle('sidebar-collapsed');
                if (document.body.classList.contains('sidebar-collapsed')) {
                    localStorage.setItem('sidebarState', 'collapsed');
                } else {
                    localStorage.setItem('sidebarState', 'expanded');
                }
            }
        }
    </script>

    <!-- Logout Modal -->
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" style="max-width: 420px;">
            <div class="modal-content" style="border-radius: 20px; border: none; background: linear-gradient(180deg, #eef2f6 0%, #ffffff 100%); padding: 15px;">
                <div class="modal-body text-center p-5">
                    <div class="mb-4 mx-auto d-flex justify-content-center align-items-center" style="width: 80px; height: 80px; background-color: #e2e8f0; border-radius: 50%;">
                        <i class="fas fa-sign-out-alt" style="font-size: 32px; color: #0f172a;"></i>
                    </div>
                    <h3 class="fw-bold mb-3" style="color: #0f172a; font-size: 28px;">Logout</h3>
                    <p class="text-muted mb-5" style="font-size: 16px;">Are you sure you want to logout?</p>
                    <div class="d-flex justify-content-between gap-3">
                        <button type="button" class="btn fw-bold py-2" style="color: #2563eb; width: 50%; border-radius: 12px; font-size: 18px; background: transparent;" data-bs-dismiss="modal">Cancel</button>
                        <a href="{{url_for('routes.logoutsecurity')}}" class="btn fw-bold text-white py-2" style="background-color: #3b82f6; width: 50%; border-radius: 12px; font-size: 18px; border: none;">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS for Modals -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
