<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Gateway - External Scanner</title>
    <!-- Modern Biometric Scanner Styles -->
    <link href="{{ url_for('static', filename='camera.css') }}" rel="stylesheet" />
    <link href="../static/camera.css" rel="stylesheet" />
    <!-- Font Awesome & Tailwind CSS for Modern Project UI Parity -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Dependencies -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .modal-backdrop { opacity: 0.8 !important; }
    </style>
</head>
<body>
    <div class="scanner-wrapper">
        <div class="scanner-card">
            <!-- Live Status Indicator -->
            <div class="status-badge">
                <div class="live-indicator"></div>
                <span id="scan-status">Smart Gateway Active</span>
            </div>

            <!-- Header Titles -->
            <h1 class="scanner-title">Smart <span class="highlight">Gateway Scan</span></h1>
            <p class="scanner-subtitle">Position yourself clearly inside the frame for automated guest and delivery gateway authentication.</p>

            <!-- Spacious Rounded Viewfinder with Clockwise Green Border Light -->
            <div class="camera-frame-wrapper">
                <div class="camera-inner">
                    <img id="camera-feed" src="" alt="Camera Feed" />
                </div>
            </div>

            <!-- Digital Timer Display -->
            <div class="timer-box" id="timer-container">
                <i class="fas fa-camera text-emerald-600 me-2"></i> Scanning in <span class="timer-number" id="timer">3</span> seconds
            </div>

            <!-- Feature & Instructional Pills -->
            <div class="scanner-tips">
                <div class="tip-chip"><i class="fas fa-truck-fast"></i> Quick Delivery Logging</div>
                <div class="tip-chip"><i class="fas fa-eye"></i> Clear Face View</div>
                <div class="tip-chip"><i class="fas fa-bolt"></i> Express Pass</div>
            </div>
        </div>
    </div>

<script>
    let timeLeft = 3; // seconds
    const timerEl = document.getElementById('timer');
    const timerContainer = document.getElementById('timer-container');
    const scanStatus = document.getElementById('scan-status');

    const countdown = setInterval(() => {
        timeLeft--;
        if (timerEl) {
            timerEl.textContent = timeLeft;
        }

        if (timeLeft <= 0) {
            clearInterval(countdown);
            if (timerContainer) {
                timerContainer.innerHTML = '<i class="fas fa-spinner fa-spin text-emerald-600 me-2"></i> <span class="font-bold text-slate-700">Opening Gateway...</span>';
            }
            if (scanStatus) {
                scanStatus.textContent = "Processing Capture...";
            }
        }
    }, 1000);

    // After 4.5 seconds, redirect to the smart gateway modal
    setTimeout(function () {
        window.location.href = "{{ url_for('face_auth.other_modal') }}";
    }, 4500);
</script>

<script>
    window.addEventListener("pageshow", function(event) {
        if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
            window.location.reload();
        }
    });

    document.addEventListener("DOMContentLoaded", function() {
        var img = document.getElementById("camera-feed");
        if(img) {
            var url = "";
            if (window.location.href.includes("face_login")) {
                url = "{{ url_for('face_auth.face_video_feed') }}";
            } else {
                url = "{{ url_for('image_processing.video_feed') }}";
            }
            img.src = url + "?t=" + new Date().getTime();
        }
    });
</script>
</body>
</html>
